<svg xmlns="http://www.w3.org/2000/svg" width="40" height="46" viewBox="0 0 40 46" fill="none">
  <defs>
    <!-- Soft 3D Drop Shadow -->
    <filter id="handShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <!-- Vibrant Cartoon Red Fill Gradient -->
    <linearGradient id="cartoonRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2430"/>
      <stop offset="50%" stop-color="#EE0D19"/>
      <stop offset="100%" stop-color="#C2000B"/>
    </linearGradient>

    <!-- Smooth 3D Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB5B9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF757C" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <g filter="url(#handShadow)">
    <!-- Main Hand Outer Shape -->
    <path d="M 14 2 
             C 11.8 2 10 3.8 10 6 
             L 10 18.5 
             C 8.2 16.8 5.5 16.8 3.8 18.5 
             C 2.2 20.2 2.2 22.8 3.8 24.5 
             L 6.5 28.5 
             C 9 32.5 13 34.5 17.5 34.5 
             L 22.5 34.5 
             C 27.5 34.5 31.5 30.5 31.5 25.5 
             L 31.5 20 
             C 31.5 18.3 30.2 17 28.5 17 
             C 27.8 17 27.1 17.3 26.5 17.8 
             C 25.8 15.8 24.2 14.5 22.2 14.5 
             C 21.5 14.5 20.8 14.8 20.2 15.3 
             C 19.5 13.8 17.8 12.5 15.8 12.5 
             L 15.8 6 
             C 15.8 3.8 14 2 14 2 
             Z" 
          fill="url(#cartoonRedGrad)" 
          stroke="#680004" 
          stroke-width="2.2" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- 3D Inner Highlight on Left Edge of Index Finger -->
    <path d="M 11.2 5.5 
             L 11.2 17.5 
             C 11.2 18.5 10.8 19.2 10.2 19.8" 
          stroke="url(#highlightGrad)" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          fill="none" />

    <!-- 3D Highlight on Thumb -->
    <path d="M 4.8 20 
             C 4 21 4 22.2 5.2 23.5" 
          stroke="url(#highlightGrad)" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          fill="none" />

    <!-- 3D Highlight curves on tops of folded fingers -->
    <path d="M 17.5 13.8 C 18.5 13.3 19.5 13.5 20 14" stroke="url(#highlightGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M 23 15.8 C 24 15.3 25 15.5 25.8 16" stroke="url(#highlightGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M 28.2 18.3 C 29.2 17.8 30 18.2 30.5 18.8" stroke="url(#highlightGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />

    <!-- Dark Finger Separator Lines -->
    <path d="M 10 18.5 C 7.5 21.5 7.5 25 8.8 28" stroke="#520003" stroke-width="2" stroke-linecap="round" />
    <path d="M 15.8 12.5 L 15.8 24" stroke="#520003" stroke-width="2" stroke-linecap="round" />
    <path d="M 20.8 14.5 L 20.8 24.5" stroke="#520003" stroke-width="2" stroke-linecap="round" />
    <path d="M 26.5 17 L 26.5 25" stroke="#520003" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>