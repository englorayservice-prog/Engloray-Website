<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" fill="none">
  <defs>
    <!-- Soft 3D Drop Shadow -->
    <filter id="arrowShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Rich 3D Red Gradient -->
    <linearGradient id="arrowRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3C"/>
      <stop offset="45%" stop-color="#E50917"/>
      <stop offset="100%" stop-color="#99000A"/>
    </linearGradient>

    <!-- Peach 3D Edge Highlight Gradient -->
    <linearGradient id="arrowHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBCC0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FF7A82" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2E3C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#arrowShadow)">
    <!-- Main Arrow Body: Top-left tip at (4,4) -->
    <path
      d="M 4 4 
         L 40 20 
         C 38 22 28 26 22 30 
         C 18 34 14 38 12 40 
         Z"
      fill="url(#arrowRedGrad)"
      stroke="#590005"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Top-left 3D Bevel/Highlight Overlay -->
    <path
      d="M 6.5 6.5
         L 36 19.5
         L 21.5 28.5
         Z"
      fill="url(#arrowHighlight)"
      opacity="0.65"
    />

    <!-- Sharp Edge Highlight Line along Top Edge -->
    <path
      d="M 5 5 L 38 19.5"
      stroke="#FFD4D6"
      stroke-width="1.5"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>
</svg>
