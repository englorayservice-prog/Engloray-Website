<svg xmlns="http://www.w3.org/2000/svg" width="42" height="46" viewBox="0 0 42 46" fill="none">
  <defs>
    <!-- Soft 3D Drop Shadow -->
    <filter id="handShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Rich 3D Red Gradient -->
    <linearGradient id="handRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3C"/>
      <stop offset="50%" stop-color="#E50917"/>
      <stop offset="100%" stop-color="#99000A"/>
    </linearGradient>

    <!-- Peach 3D Edge Highlight Gradient -->
    <linearGradient id="handHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBCC0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF7A82" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <g filter="url(#handShadow)">
    <!-- Outer Hand Boundary: Index finger tip at (15, 3) -->
    <path
      d="M 15 3
         C 12.2 3 10 5.2 10 8
         L 10 19
         C 8.2 17.2 5.5 17.2 3.8 19
         C 2.2 20.8 2.2 23.4 3.8 25.1
         L 6.5 29.1
         C 9 33.1 13.2 35.5 17.8 35.5
         L 23 35.5
         C 28 35.5 32 31.5 32 26.5
         L 32 20.5
         C 32 18.8 30.7 17.5 29 17.5
         C 28.3 17.5 27.6 17.8 27 18.3
         C 26.3 16.3 24.7 15 22.7 15
         C 22 15 21.3 15.3 20.7 15.8
         C 20 14.2 18.3 13 16.3 13
         L 16.3 8
         C 16.3 5.2 17.8 3 15 3
         Z"
      fill="url(#handRedGrad)"
      stroke="#590005"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 3D Highlight on Left Edge of Extended Index Finger -->
    <path
      d="M 11.5 7.5 L 11.5 18 C 11.5 19 11 19.8 10.2 20.5"
      stroke="url(#handHighlight)"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Highlight on Thumb -->
    <path
      d="M 4.8 20.5 C 4 21.5 4 22.8 5.5 24.2"
      stroke="url(#handHighlight)"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Highlights on Folded Knuckles -->
    <path d="M 18 14.3 C 19 13.8 20 14 20.5 14.5" stroke="url(#handHighlight)" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 23.5 16.3 C 24.5 15.8 25.5 16 26.3 16.5" stroke="url(#handHighlight)" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 28.8 18.8 C 29.8 18.3 30.5 18.7 31 19.3" stroke="url(#handHighlight)" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Dark Finger Separation Lines -->
    <path d="M 10 19 C 7.5 22 7.5 25.5 8.8 28.5" stroke="#480004" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 16.3 13 L 16.3 24.5" stroke="#480004" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 21.3 15 L 21.3 25" stroke="#480004" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 27 17.5 L 27 25.5" stroke="#480004" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>